name: Bug 报告 Bug report
description: 什么地方不正常?Something isn't working
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 What happened?
      description: 简单描述你看到的问题。A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 Steps to reproduce
      description: 越具体越好,例如:新建房间 → 添加浴缸 → 拖到墙边 → 换沙发。
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望 vs 实际 Expected vs actual
      description: 你期望看到什么?实际看到什么?
  - type: textarea
    id: shot
    attributes:
      label: 截图 Screenshot
      description: 直接把图片拖进这个框。Drag & drop an image here. 如有控制台错误(F12 → Console)也请一并贴上。
  - type: input
    id: browser
    attributes:
      label: 浏览器 Browser
      placeholder: 例如 Chrome 126 / Safari 17
